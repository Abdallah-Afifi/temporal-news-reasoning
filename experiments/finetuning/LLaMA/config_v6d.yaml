# LLaMA-3.2-3B-Instruct LoRA Fine-Tuning Configuration — V6 CYCLE
# ================================================================
# "v5-corrected". Data-only bundle (docs/v6_plan.md): hyperparameters are
# IDENTICAL to v2/v3-corrected/v4/v5 — only train_data, val_data and
# output_dir change, so v6 stays comparable to every earlier arm.
#
# Rationale (measured 2026-09-07, after the trailing-letter scoring fix):
# v5 already BEATS zero-shot on the 44.7% answerable-MCQ bucket
# (64.50% vs 63.56%). Its whole remaining 3.03pp TIME deficit is two output
# behaviours, not reasoning:
#     letter sequence   10.8% of TIME   zs 19.05%  -> v5  0.00%   -2.06pp
#     MCQ "no answer"    2.3% of TIME   zs 52.95%  -> v5  0.74%   -1.21pp
# v6 addresses exactly those, plus the rehearsal dilution that caused the
# first one, and changes nothing else.
#
# THREE data variables (this is deliberately a COMBINED arm aimed at the
# thesis target, not a single-variable ablation — see docs/v6_plan.md § 5 for
# the attribution plan that must follow it):
#   1. rehearsal 8,026 -> 2,600 rows, half of it long-form dolly again
#   2. AUG_SEQ  +1,273  comma-separated-letter ordering (never trained before)
#   3. AUG_NOANS +500 / AUG_MCQ2 +1,500  abstention, with a 4:1 answerable
#      counterweight so the model cannot just learn to always abstain
#
# EXPECT A SHORTER RUN THAN v5. 14,850 train rows vs v5's 18,180 (-18%), and
# the removed rows are the long HotpotQA/DROP/CoQA passages. v5 took 9h03m at
# 3,408 steps; v6 should land near 2,790 steps / ~7 h. Batch shape, LoRA rank,
# LR, epochs and gradient_checkpointing are untouched — see the v5 comments
# below, which still apply verbatim.

# ── Model ──────────────────────────────────────────────
model_path: models/Llama-3.2-3B-Instruct
seed: 42
dtype: bfloat16

# ── Data ───────────────────────────────────────────────
train_data: data/combined_80_20_v6d/train.jsonl
val_data: data/combined_80_20_v6d/val.jsonl
max_seq_length: 2048

# ── Training (identical to v2 / HPO-optimized) ─────────
learning_rate: 4.62258900102083e-04
num_train_epochs: 3
warmup_ratio: 0.08185086660174143
weight_decay: 0.010909498032426036
lr_scheduler_type: cosine
bf16: true
fp16: false

# ── Speed optimizations (RTX 3090 24 GB) ───────────────
# Activation checkpointing recomputes activations in the backward pass to
# save memory. Gradients are mathematically identical either way, so turning
# it off is a pure speed/memory trade and does NOT change the recipe — v4
# stays comparable to v1-v3. Set back to true if this OOMs.
# 2026-09-05: it OOMed on the first training step (22.31/23.53 GiB used by
# this process alone) -- v4's new rehearsal data (HotpotQA/DROP/CoQA full
# passages, avg 429 / max 1,518 tokens) runs far longer than v1-v3's dolly
# rehearsal ever did. Turned back on per this comment's own contingency.
gradient_checkpointing: true
attn_implementation: sdpa
# BATCH SHAPE: 2 x 8, identical to v1/v2/v3/v3-corrected. Do not "optimise"
# this — it was measured on 2026-09-05 and larger micro-batches are WORSE on
# this card (full write-up: docs/v4_plan.md § "Throughput protocol"):
#   2 x 8  ->  8.4-9.6 s/it   (~6 h)   <- this, the fastest measured
#   4 x 4  -> 11.9-13.0 s/it  (~8 h)   ~35% slower
#   8 x 2  -> OOM (tried to allocate 6.48 GiB with 2.88 GiB free)
# Why bigger is slower: the GPU is already saturated at batch 2 (2048-token
# sequences on a 3B model), so a larger micro-batch adds no parallelism — it
# just pads every sequence out to the longest in the group (this data runs
# 429 tokens avg, 1,518 max), and gradient_checkpointing then recomputes that
# padding in the backward pass too.
# Why 8 OOMs: the ceiling is the logits tensor, batch x seq_len x vocab, and
# Llama-3's vocab is 128,256 -> ~2.1 GB at batch 2 but ~8.4 GB at batch 8 in
# fp32. gradient_checkpointing does not shrink it, and fixing flash-attn
# would not either (it is the loss input, not an attention intermediate).
# Keeping 2 x 8 also keeps v4 bit-comparable to v1-v3: no second variable.
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
dataloader_num_workers: 4
dataloader_pin_memory: true
tf32: true

# ── Logging & Checkpointing ────────────────────────────
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 2

# ── LoRA (identical to v2) ──────────────────────────────
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ── Quantization ───────────────────────────────────────
load_in_4bit: false

# ── Output ─────────────────────────────────────────────
output_dir: checkpoints/llama_v6d
progress_dir: experiments/finetuning/LLaMA/Progress

# ── Reporting ──────────────────────────────────────────
report_to: []
