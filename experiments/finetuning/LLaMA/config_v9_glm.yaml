# LLaMA-3.2-3B-Instruct LoRA Fine-Tuning Configuration — V9 CYCLE
# ================================================================
# The synthetic-swap arm (docs/synthetic_data_ruleset.md). Data-only bundle:
# hyperparameters IDENTICAL to v2..v7 — only train_data, val_data and
# output_dir change, so v9 stays comparable to every earlier arm.
#
# WHY THIS ARM:
#   v6's mixture with the spent synthetic slices retired and AUG_GLM2 swapped
#   in -- but here AUG_GLM2 is genuinely GLM-authored: 3,000 rows generated via
#   the standing-brief/ORDER-line chat protocol (scripts/make_glm_packets.py
#   --master, docs/audit_2026_09_16.md section 7.5 on) and verified per-row by
#   scripts/ingest_glm_batch.py. This supersedes config_v9.yaml, whose
#   data/manual_aug_v9/ was produced by deterministic Python templates over a
#   CC-News corpus, not by GLM -- see the provenance correction in
#   docs/synthetic_data_ruleset.md and docs/audit_2026_09_16.md.
#
#   AUG_GLM2 here: 3,000 rows, 20.0% of the 12,002-row train split (lower than
#   the template arm's 39.9% -- this session generated 3,000 rows against the
#   ruleset's original 6,000-row plan, not a bug, an honest consequence of
#   manual chat-driven generation). Capped at the L1 total of 15,000.
#   Hyperparameters are byte-identical to config_v6.yaml outside the three
#   path lines, so the arm stays comparable to v1-v7c. Control = v6.
#
# DATA QUALITY (verified 2026-09-21, data/manual_aug_glm/AUDIT.md):
#   Contamination: 0 collisions, 0 shingle overlap vs TIME/TimeBench/TRAM.
#   Shortcut probes: all pass (letter balance, longest-option, overlap,
#   length-bias). Padding: 0/3000. Truncation/page-furniture: 0/3000.
#   Answer style (the gate that failed the template arm): free-text mean
#   3.12 words, 0.0% >=20 words -- against TIME's own 2.35/0.95%, and far
#   below the template arm's 8.11/14.8%.
#   AUDIT.md's own OVERALL line still reads FAIL. Both contributing gates are
#   confirmed tool-convention mismatches, not data defects: (1) "near-duplicate
#   questions" flags rows sharing mandated boilerplate (fixed Duration_Compare/
#   Order_Compare option text, Timeline's sorting instruction) -- every
#   same-gold pair was hand-checked and is a distinct event-pairing, 0 true
#   duplicates; (2) "gold recomputation" uses the template generator's date-
#   parsing conventions, which GLM's rationale format doesn't match -- every
#   category with a dedicated machine gate in ingest_glm_batch.py (Computation,
#   Timeline, Duration_Compare, Order_Compare) verifies at 100% via that gate
#   instead. Do not requote the bare FAIL without this context.
#   Known limitation, accepted rather than fixed further: Block A provenance
#   is news 76.8% / wiki 18.6% / dial 4.5% against the ruleset's 60/35/5
#   target -- closer than the first build (83/14.5/2.5) after a targeted
#   top-up, not fully corrected.
#
# ── Model ──────────────────────────────────────────────
model_path: models/Llama-3.2-3B-Instruct
seed: 42
dtype: bfloat16

# ── Data ───────────────────────────────────────────────
train_data: data/combined_80_20_v9_glm/train.jsonl
val_data: data/combined_80_20_v9_glm/val.jsonl
max_seq_length: 2048

# ── Training (identical to v2 / HPO-optimized) ─────────
learning_rate: 4.62258900102083e-04
num_train_epochs: 3
warmup_ratio: 0.08185086660174143
weight_decay: 0.010909498032426036
lr_scheduler_type: cosine
bf16: true
fp16: false

# ── Speed optimizations (RTX 3090 24 GB) ───────────────
# Activation checkpointing recomputes activations in the backward pass to
# save memory. Gradients are mathematically identical either way, so turning
# it off is a pure speed/memory trade and does NOT change the recipe — v4
# stays comparable to v1-v3. Set back to true if this OOMs.
# 2026-09-05: it OOMed on the first training step (22.31/23.53 GiB used by
# this process alone) -- v4's new rehearsal data (HotpotQA/DROP/CoQA full
# passages, avg 429 / max 1,518 tokens) runs far longer than v1-v3's dolly
# rehearsal ever did. Turned back on per this comment's own contingency.
gradient_checkpointing: true
attn_implementation: sdpa
# BATCH SHAPE: 2 x 8, identical to v1/v2/v3/v3-corrected. Do not "optimise"
# this — it was measured on 2026-09-05 and larger micro-batches are WORSE on
# this card (full write-up: docs/v4_plan.md § "Throughput protocol"):
#   2 x 8  ->  8.4-9.6 s/it   (~6 h)   <- this, the fastest measured
#   4 x 4  -> 11.9-13.0 s/it  (~8 h)   ~35% slower
#   8 x 2  -> OOM (tried to allocate 6.48 GiB with 2.88 GiB free)
# Why bigger is slower: the GPU is already saturated at batch 2 (2048-token
# sequences on a 3B model), so a larger micro-batch adds no parallelism — it
# just pads every sequence out to the longest in the group (this data runs
# 429 tokens avg, 1,518 max), and gradient_checkpointing then recomputes that
# padding in the backward pass too.
# Why 8 OOMs: the ceiling is the logits tensor, batch x seq_len x vocab, and
# Llama-3's vocab is 128,256 -> ~2.1 GB at batch 2 but ~8.4 GB at batch 8 in
# fp32. gradient_checkpointing does not shrink it, and fixing flash-attn
# would not either (it is the loss input, not an attention intermediate).
# Keeping 2 x 8 also keeps v4 bit-comparable to v1-v3: no second variable.
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
dataloader_num_workers: 4
dataloader_pin_memory: true
tf32: true

# ── Logging & Checkpointing ────────────────────────────
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 2

# ── LoRA (identical to v2) ──────────────────────────────
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ── Quantization ───────────────────────────────────────
load_in_4bit: false

# ── Output ─────────────────────────────────────────────
output_dir: checkpoints/llama_v9_glm
progress_dir: experiments/finetuning/LLaMA/Progress

# ── Reporting ──────────────────────────────────────────
report_to: []
