# v13-prog pilot: v13-base recipe on the PROVISIONAL v13 build (v12 +
# AUG_PROG programmatic rows only, no GLM wave yet).
# Dev-eval ablation arm -- NOT quotable as v13 (docs/v13_plan.md §4).

model_path: models/Llama-3.2-3B-Instruct
seed: 42
dtype: bfloat16
prompt_format: eval_parity
# combined_80_20_v13 is now the final build; the pilot's data was preserved
# here before the rebuild (audit 2026-10-04 §4.2).
train_data: data/training_versions/v13_provisional/data/train.jsonl
val_data: data/training_versions/v13_provisional/data/val.jsonl
max_seq_length: 2048
learning_rate: 0.000177
num_train_epochs: 1
warmup_ratio: 0.08185086660174143
weight_decay: 0.010909498032426036
lr_scheduler_type: cosine
bf16: true
fp16: false
gradient_checkpointing: true
attn_implementation: sdpa
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
dataloader_num_workers: 4
dataloader_pin_memory: true
tf32: true
logging_steps: 10
eval_strategy: 'no'
save_strategy: 'no'
load_best_model_at_end: false
early_stopping_patience: 0
final_eval: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
load_in_4bit: false
output_dir: checkpoints/llama_v13_prog_pilot
progress_dir: experiments/finetuning/LLaMA/Progress
report_to: []
