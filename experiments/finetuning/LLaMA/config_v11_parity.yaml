# LLaMA-3.2-3B-Instruct LoRA — V11 (PROMPT PARITY) BASE CONFIG
# ================================================================
# The base every HPO trial (scripts/hpo_v11.py) and the final v11 arms derive
# from. What changes vs config_v10_glm.yaml, and why (docs/audit_2026_09_23.md):
#
#  1. prompt_format: eval_parity. Every arm through v10-glm was trained on the
#     legacy "Context:/Question:" prompt with a custom system prompt, then
#     evaluated on run_baselines._build_zero_shot_prompt -- a prompt it had
#     never seen. Now training renders the EXACT evaluation prompt, with no
#     system prompt and the chat template's date pinned to 26 Jul 2024, so a
#     fine-tuned run differs from the zero-shot run ONLY in weights. Evaluate
#     with run_eval_vllm.py --system-prompt none --date-string "26 Jul 2024".
#  2. data/combined_80_20_v11: v10-glm's mixture minus 561 TimeQA rows that
#     share a >=30-token passage with a benchmark test item (298 TimeBench
#     items even had the identical gold) and 124 relation/ordering rows whose
#     gold is outside TRAM's gold label space. scripts/build_v11_parity_data.py.
#  3. Parity tokenisation drops rows whose gold is truncated out of the context
#     (306 TimeQA rows) instead of training on them.
#  4. seed now reaches TrainingArguments (it only reached LoRA init before).
#
# learning_rate / num_train_epochs / lora_r / lora_alpha below are the v10
# values and serve only as HPO trial 0 (the "old hyperparameters, new prompt"
# anchor). The search overrides them per trial; the final arm uses the
# dev-selected values written to results/hpo_v11/best.json.

model_path: models/Llama-3.2-3B-Instruct
seed: 42
dtype: bfloat16
prompt_format: eval_parity

train_data: data/combined_80_20_v11/train.jsonl
val_data: data/combined_80_20_v11/val.jsonl
max_seq_length: 2048

learning_rate: 4.62258900102083e-04
num_train_epochs: 3
warmup_ratio: 0.08185086660174143
weight_decay: 0.010909498032426036
lr_scheduler_type: cosine
bf16: true
fp16: false
gradient_checkpointing: true
attn_implementation: sdpa
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
dataloader_num_workers: 4
dataloader_pin_memory: true
tf32: true

logging_steps: 10
# Selection is on dev-set accuracy, never on in-distribution val loss (the
# val split shares passages with train for 1,090/1,110 AUG_GLM2 rows).
eval_strategy: "no"
save_strategy: "no"
load_best_model_at_end: false
early_stopping_patience: 0
final_eval: false

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

load_in_4bit: false
output_dir: checkpoints/llama_v11
progress_dir: experiments/finetuning/LLaMA/Progress
report_to: []
