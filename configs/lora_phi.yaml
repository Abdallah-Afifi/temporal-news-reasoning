# ============================================================
# LoRA Fine-tuning Configuration — Phi-3-mini-4k-instruct
# ============================================================

model:
  name: "microsoft/Phi-3-mini-4k-instruct"
  local_path: "./checkpoints/phi"
  dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["qkv_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./checkpoints/phi"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 500
  eval_steps: 250
  fp16: false
  bf16: true
  max_seq_length: 2048

curriculum:
  stages:
    - name: "stage1_explicit"
      data: "./data/training/stage1_explicit.jsonl"
      epochs: 1
    - name: "stage2_implicit"
      data: "./data/training/stage2_implicit.jsonl"
      epochs: 1
    - name: "stage3_complex"
      data: "./data/training/stage3_complex.jsonl"
      epochs: 1

wandb:
  project: "temporal-news-reasoning"
  run_name: "phi-lora-curriculum"
