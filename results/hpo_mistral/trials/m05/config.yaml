model_path: models/Mistral-7B-Instruct-v0.3
seed: 42
dtype: bfloat16
prompt_format: eval_parity
train_data: data/combined_80_20_v12/train.jsonl
val_data: data/combined_80_20_v12/val.jsonl
max_seq_length: 2048
learning_rate: 3.72e-05
num_train_epochs: 1
warmup_ratio: 0.1
weight_decay: 0.01
lr_scheduler_type: cosine
bf16: true
fp16: false
gradient_checkpointing: true
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
dataloader_num_workers: 4
dataloader_pin_memory: true
tf32: true
eval_strategy: 'no'
save_strategy: 'no'
load_best_model_at_end: false
early_stopping_patience: 0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
load_in_4bit: true
output_dir: checkpoints/hpo_mistral/m05
progress_dir: experiments/finetuning/Mistral/Progress
report_to: []
