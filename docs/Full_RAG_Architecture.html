<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detailed RAG Implementation Architecture - Final Tri-Store Stack</title>
<style>
/* Robust System Fonts */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  padding: 40px 0;
}

.canvas {
  width: 1100px;
  margin: 0 auto;
  background: white;
  border: 1px solid #e2e8f0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border-radius: 12px;
  padding: 30px;
}

h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; text-align: center; color: #0f172a; }
p.subtitle { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 30px; }

.arch-svg {
  display: block;
  width: 100%;
  max-width: 1060px;
  height: auto;
  border: 1px solid #f1f5f9;
  border-radius: 8px;
  background: #fff;
}

/* SVG text classes */
.label     { font-size: 12.5px; font-weight: 800; fill: #0f172a; font-family: sans-serif; }
.sub-label { font-size: 10.5px; font-weight: 500; fill: #334155; font-family: monospace; }
.math      { font-size: 11.5px; fill: #1d4ed8; font-weight: bold; font-family: monospace; }
.header    { font-size: 15px; font-weight: 800; fill: #1e293b; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; }

</style>
</head>
<body>
<div class="canvas">
  <h1>Final Temporal RAG Implementation Architecture</h1>
  <p class="subtitle">Parallel Tri-Store Extraction and Query Routing System</p>

  <svg viewBox="0 0 1060 1180" width="100%" height="1180" class="arch-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arr" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 11 4, 0 8" fill="#64748b"/>
      </marker>
      <marker id="arr-sql" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 11 4, 0 8" fill="#10b981"/>
      </marker>
      <marker id="arr-sem" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 11 4, 0 8" fill="#8b5cf6"/>
      </marker>
      <marker id="arr-ext" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 11 4, 0 8" fill="#ea580c"/>
      </marker>
      
      <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff"/>
        <stop offset="100%" style="stop-color:#f8fafc"/>
      </linearGradient>
      <linearGradient id="semGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f5f3ff"/>
        <stop offset="100%" style="stop-color:#ede9fe"/>
      </linearGradient>
      <linearGradient id="extGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#fff7ed"/>
        <stop offset="100%" style="stop-color:#ffedd5"/>
      </linearGradient>
      <linearGradient id="newGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f0f9ff"/>
        <stop offset="100%" style="stop-color:#e0f2fe"/>
      </linearGradient>
      <marker id="arr-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 11 4, 0 8" fill="#0284c7"/>
      </marker>
    </defs>

    <rect x="18" y="55" width="410" height="1100" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="223" y="44" text-anchor="middle" class="header">1. Ingestion Pipeline (Offline)</text>

    <rect x="84" y="72" width="288" height="52" rx="5" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="228" y="93" text-anchor="middle" class="label">News Corpus (JSON/CSV)</text>
    <text x="228" y="112" text-anchor="middle" class="sub-label">[doc_id, text, pub_date]</text>
    <line x1="228" y1="124" x2="228" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="84" y="154" width="288" height="55" rx="5" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="228" y="178" text-anchor="middle" class="label">Coreference Resolution</text>
    <text x="228" y="197" text-anchor="middle" class="sub-label">fastcoref | Pronoun Dereferencing</text>
    <line x1="228" y1="209" x2="228" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="84" y="235" width="288" height="55" rx="5" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="228" y="259" text-anchor="middle" class="label">Recursive Character Splitter</text>
    <text x="228" y="278" text-anchor="middle" class="sub-label">Chunk: 512 tokens  |  Overlap: 50 tokens</text>

    <path d="M228,290 L228,325 L136,325 L136,360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M228,290 L228,325 L312,325 L312,360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    
    <path d="M227,290 L227,910" fill="none" stroke="#10b981" stroke-dasharray="5,4" stroke-width="2.5" marker-end="url(#arr-sql)"/>
    <text x="220" y="600" text-anchor="end" class="sub-label" fill="#047857" font-weight="700" transform="rotate(-90 220,600)">Raw Text Chunk Flow</text>

    <rect x="56" y="360" width="160" height="70" rx="5" fill="url(#semGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="136" y="382" text-anchor="middle" class="label" fill="#4c1d95">Embed Input Builder</text>
    <text x="136" y="400" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9" font-family="monospace">embeds chunks </text>
    <line x1="136" y1="430" x2="136" y2="470" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-sem)"/>

    <rect x="56" y="470" width="160" height="60" rx="5" fill="url(#semGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="136" y="495" text-anchor="middle" class="label" fill="#4c1d95">Sentence-BERT</text>
    <text x="136" y="515" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6d28d9" font-family="monospace">all-MiniLM-L12-v2</text>
    
    <path d="M136,530 L136,910" fill="none" stroke="#8b5cf6" stroke-dasharray="5,4" stroke-width="2.5" marker-end="url(#arr-sem)"/>
    <text x="129" y="720" text-anchor="end" font-size="10.5" fill="#6d28d9" font-weight="700" font-family="monospace" transform="rotate(-90 129,720)">384d Vectors</text>

    <rect x="232" y="360" width="160" height="70" rx="5" fill="url(#extGrad)" stroke="#ea580c" stroke-width="2.5"/>
    <text x="312" y="382" text-anchor="middle" class="label" fill="#9a3412">GLiNER Extractor</text>
    <text x="312" y="398" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Extracts DATE, TIME,</text>
    <text x="312" y="413" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">EVENT, ENTITY</text>
    <line x1="312" y1="430" x2="312" y2="470" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-ext)"/>

    <rect x="232" y="470" width="160" height="70" rx="5" fill="url(#extGrad)" stroke="#ea580c" stroke-width="2.5"/>
    <text x="312" y="492" text-anchor="middle" class="label" fill="#9a3412">Rule-Based Normalizer</text>
    <text x="312" y="508" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Duckling/HeidelTime</text>
    <text x="312" y="523" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Resolves Unix Epochs</text>
    <line x1="312" y1="540" x2="312" y2="580" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-ext)"/>

    <rect x="232" y="580" width="160" height="70" rx="5" fill="url(#extGrad)" stroke="#ea580c" stroke-width="2.5"/>
    <text x="312" y="603" text-anchor="middle" class="label" fill="#9a3412">TIMEX3 Fallback</text>
    <text x="312" y="621" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">No DATE? Use pub_date</text>
    <text x="312" y="636" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Sets T_start = T_end</text>
    <line x1="312" y1="650" x2="312" y2="690" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-ext)"/>

    <rect x="232" y="690" width="160" height="70" rx="5" fill="url(#extGrad)" stroke="#ea580c" stroke-width="2.5"/>
    <text x="312" y="714" text-anchor="middle" class="label" fill="#9a3412">Temporal IE</text>
    <text x="312" y="732" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Event-Time Linking</text>
    <text x="312" y="747" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="monospace">Generates Graph Edges</text>

    <path d="M312,760 L312,910" fill="none" stroke="#ea580c" stroke-dasharray="5,4" stroke-width="2.5" marker-end="url(#arr-ext)"/>
    <text x="316" y="780" text-anchor="start" font-size="11px" font-weight="700" font-family="monospace" fill="#c2410c" transform="rotate(90 316,780)">Graph Edges</text>
    
    <path d="M312,760 L312,790 L240,790 L240,910" fill="none" stroke="#ea580c" stroke-dasharray="5,4" stroke-width="2.5" marker-end="url(#arr-ext)"/>
    <text x="244" y="799" text-anchor="start" font-size="10.5" font-weight="700" font-family="monospace" fill="#047857" transform="rotate(90 244,810)">[t_start, t_end]</text>


    <rect x="84" y="910" width="288" height="180" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="228" y="927" text-anchor="middle" class="label">Hybrid Tri-Store</text>

    <rect x="94" y="935" width="85" height="145" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="136" y="958" text-anchor="middle" class="label" fill="#1d4ed8">FAISS</text>
    <text x="136" y="978" text-anchor="middle" class="sub-label">HNSWFlat</text>
    <text x="136" y="998" text-anchor="middle" class="sub-label">Topic Search</text>
    <text x="136" y="1018" text-anchor="middle" class="sub-label">384d vectors</text>
    <text x="136" y="1038" text-anchor="middle" class="sub-label">k=100 ANN</text>

    <rect x="185" y="935" width="85" height="145" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="227" y="958" text-anchor="middle" class="label" fill="#047857">SQL</text>
    <text x="227" y="978" text-anchor="middle" class="sub-label">PostgreSQL</text>
    <text x="227" y="998" text-anchor="middle" class="sub-label">Unix epoch</text>
    <text x="227" y="1018" text-anchor="middle" class="sub-label">Hard Filters</text>
    <text x="227" y="1038" text-anchor="middle" class="sub-label">Chunk text</text>

    <rect x="276" y="935" width="85" height="145" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="318" y="958" text-anchor="middle" class="label" fill="#075985">Temporal KG</text>
    <text x="318" y="978" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Neo4j / Graph</text>
    <text x="318" y="998" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Event Nodes</text>
    <text x="318" y="1018" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Time Edges</text>
    <text x="318" y="1038" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Entity Links</text>

    <rect x="448" y="55" width="592" height="1100" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="744" y="44" text-anchor="middle" class="header" fill="#6366f1">2. Retrieval Path (Online)</text>

    <rect x="915" y="65" width="112" height="58" rx="5" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="971" y="81" font-size="9.5" font-weight="800" fill="#64748b" font-family="sans-serif" text-anchor="middle">PIPELINE LEGEND</text>
    <circle cx="928" cy="95" r="4.5" fill="#8b5cf6"/>
    <text x="940" y="99" font-size="10.5" font-weight="700" fill="#4c1d95" font-family="sans-serif">Semantic Path</text>
    <circle cx="928" cy="111" r="4.5" fill="#ea580c"/>
    <text x="940" y="115" font-size="10.5" font-weight="700" fill="#9a3412" font-family="sans-serif">Extraction Path</text>

    <path d="M580,72 L886,72 L908,100 L886,128 L580,128 Z" fill="#6366f1"/>
    <text x="744" y="105" text-anchor="middle" class="label" fill="#fff" font-size="14px">USER QUERY: q</text>
    <line x1="744" y1="128" x2="744" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="580" y="175" width="318" height="62" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="739" y="199" text-anchor="middle" class="label" fill="#075985">Query Parser (GLiNER + Normalizer)</text>
    <text x="739" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Extracts Query Span → Normalizes to ISO-8601</text>
    <text x="739" y="233" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Matches dual-stage pipeline from offline ingestion</text>

    <path d="M744,237 L744,280 L569,280 L569,320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M744,237 L744,280 L879,280 L879,320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="462" y="320" width="214" height="100" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="569" y="350" text-anchor="middle" class="label">Vector ANN Fetch</text>
    <text x="569" y="373" text-anchor="middle" class="sub-label">HNSW Semantic Match (k=100)</text>
    <text x="569" y="400" text-anchor="middle" class="math">S_semantic</text>

    <rect x="760" y="320" width="238" height="100" rx="5" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
    <text x="879" y="350" text-anchor="middle" class="label">Metadata Filter</text>
    <text x="879" y="370" text-anchor="middle" class="sub-label">Hard Date Range Gate (runs first)</text>
    <text x="879" y="390" text-anchor="middle" class="math">T_doc ∈ [q_time]</text>
    <text x="879" y="410" text-anchor="middle" class="sub-label">T_start≤q_end AND T_end≥q_start</text>

    <path d="M569,420 L569,460 L741,460 L741,490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M879,420 L879,460 L741,460 L741,490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="568" y="490" width="346" height="80" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="741" y="519" text-anchor="middle" class="label">Recency Decay Scoring</text>
    <text x="741" y="542" text-anchor="middle" class="math">Score = S_sem + β·e^(−λ·Δt)</text>
    <text x="741" y="562" text-anchor="middle" class="sub-label">β=0.3  |  λ=0.1  |  Δt in days</text>
    <line x1="741" y1="570" x2="741" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="568" y="630" width="346" height="62" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="741" y="655" text-anchor="middle" class="label">Cross-Encoder Re-Ranker</text>
    <text x="741" y="673" text-anchor="middle" class="sub-label">ms-marco-MiniLM-L-6-v2  |  Top-K (k=10)</text>
    <text x="741" y="688" text-anchor="middle" class="sub-label">Runs only on date-filtered subset</text>
    <line x1="741" y1="692" x2="741" y2="752" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="568" y="752" width="346" height="62" rx="5" fill="url(#newGrad)" stroke="#0284c7" stroke-width="2"/>
    <text x="741" y="777" text-anchor="middle" class="label" fill="#075985">Semantic Router &amp; Sub-Graph Builder</text>
    <text x="741" y="793" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Embeds user query relation to map Canonical KG Edges</text>
    <text x="741" y="807" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1" font-family="monospace">Bypasses exact-match to build explicit Fact-Chain</text>
    <line x1="741" y1="814" x2="741" y2="874" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <rect x="568" y="874" width="346" height="52" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="741" y="895" text-anchor="middle" class="label" fill="#166534" font-size="13px">SLM / LLM (Implicit Reasoning Engine)</text>
    <text x="741" y="914" text-anchor="middle" class="sub-label" fill="#166534">Performs multi-hop inference on clean structured timeline</text>

    <path d="M136,1080 L136,1120 L430,1120 L430,370 L454,370" fill="none" stroke="#8b5cf6" stroke-dasharray="6,4" stroke-width="2.5" marker-end="url(#arr-sem)"/>
    <text x="422" y="470" text-anchor="start" font-size="10.5px" fill="#6d28d9" font-weight="800" transform="rotate(-90 422,470)">Vector IDs</text>

    <path d="M227,1080 L227,1140 L1035,1140 L1035,370 L1005,370" fill="none" stroke="#10b981" stroke-dasharray="6,4" stroke-width="2.5" marker-end="url(#arr-sql)"/>
    <text x="1000" y="470" text-anchor="start" font-size="10.5px" fill="#047857" font-weight="800" transform="rotate(-90 1043,490)">Metadata &amp; Chunks</text>

    <path d="M318,1080 L318,1100 L545,1100 L545,783 L558,783" fill="none" stroke="#ea580c" stroke-dasharray="6,4" stroke-width="2.5" marker-end="url(#arr-ext)"/>
    <text x="538" y="940" text-anchor="start" font-size="10.5px" fill="#c2410c" font-weight="800" transform="rotate(-90 538,940)">Canonical Edges</text>

  </svg>
</div>
</body>
</html>
